name: Release

on:
  push:
    branches: [main]
  # Manual publish (re-publish a failed release, or a beta/next tag).
  # npm trusted publishing allows a single workflow file per package, so manual publishing lives here too.
  workflow_dispatch:
    inputs:
      tag:
        description: npm dist-tag (e.g. latest, beta, next)
        required: true
        default: latest

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Create release PR
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish to npm
    needs: release-please
    # always() lets the job run on workflow_dispatch, where release-please is skipped.
    if: always() && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@v4

      # No registry-url: setup-node would write a placeholder NODE_AUTH_TOKEN into .npmrc,
      # which npm then sends instead of exchanging the OIDC token (publish fails with E404).
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Trusted publishing needs npm >= 11.5.1 (Node 22 ships npm 10).
      - name: Upgrade npm
        run: npm install -g npm@^11.5.1

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Verify dist
        run: test -f dist/index.js && echo "✓ dist/index.js present"

      # No NODE_AUTH_TOKEN: npm authenticates via OIDC as the trusted publisher configured on npmjs.com.
      - name: Publish
        run: npm publish --access public --provenance --tag "${{ inputs.tag || 'latest' }}"

      - name: Confirm publication
        run: |
          PACKAGE=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          # npm can take several minutes to make a new version visible ("Your package is being processed").
          for i in $(seq 1 30); do
            if npm view "$PACKAGE@$VERSION" version 2>/dev/null; then
              echo "✓ $PACKAGE@$VERSION published successfully"
              exit 0
            fi
            echo "Attempt $i/30 — waiting 30s..."
            sleep 30
          done
          echo "✗ Could not confirm publication of $PACKAGE@$VERSION" && exit 1
