name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'npm dist-tag (e.g., latest, beta, next)'
        required: true
        default: 'latest'

jobs:
  publish:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      id-token: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'
        registry-url: 'https://registry.npmjs.org'

    - name: Install dependencies
      run: npm ci

    - name: Build
      run: npm run build

    - name: Verify build output
      run: |
        test -f dist/index.js || exit 1
        test -f dist/index.d.ts || exit 1
        echo "✓ Build artifacts verified"

    - name: Check package version matches release tag
      if: github.event_name == 'release'
      run: |
        PKG_VERSION=$(node -p "require('./package.json').version")
        RELEASE_TAG=${GITHUB_REF#refs/tags/v}
        if [ "$PKG_VERSION" != "$RELEASE_TAG" ]; then
          echo "❌ Package version ($PKG_VERSION) does not match release tag ($RELEASE_TAG)"
          exit 1
        fi
        echo "✓ Version check passed: $PKG_VERSION"

    - name: Determine npm tag
      id: npm-tag
      run: |
        if [ "${{ github.event_name }}" = "release" ]; then
          # For releases, check if it's a prerelease
          if [ "${{ github.event.release.prerelease }}" = "true" ]; then
            echo "tag=next" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
          fi
        else
          # For manual dispatch, use provided tag
          echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
        fi

    - name: Publish to npm
      run: npm publish --access public --tag ${{ steps.npm-tag.outputs.tag }}
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

    - name: Verify publication
      run: |
        PACKAGE_NAME=$(node -p "require('./package.json').name")
        PACKAGE_VERSION=$(node -p "require('./package.json').version")
        sleep 3
        npm view $PACKAGE_NAME@$PACKAGE_VERSION || exit 1
        echo "✓ Successfully published $PACKAGE_NAME@$PACKAGE_VERSION"
