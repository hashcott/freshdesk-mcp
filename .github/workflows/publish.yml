name: Publish (manual)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: npm dist-tag (e.g. latest, beta, next)
        required: true
        default: latest

concurrency:
  group: publish-manual
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm (${{ inputs.tag }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Verify dist
        run: test -f dist/index.js && echo "✓ dist/index.js present"

      - name: Publish
        run: npm publish --access public --provenance --tag ${{ inputs.tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Confirm publication
        run: |
          PACKAGE=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          for i in 1 2 3 4 5; do
            if npm view "$PACKAGE@$VERSION" version 2>/dev/null; then
              echo "✓ $PACKAGE@$VERSION published successfully"
              exit 0
            fi
            echo "Attempt $i/5 — waiting 10s..."
            sleep 10
          done
          echo "✗ Could not confirm publication of $PACKAGE@$VERSION" && exit 1
