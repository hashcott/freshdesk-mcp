name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies (with retries)
        run: |
          for attempt in 1 2 3; do
            npm ci && break
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "npm ci failed (attempt $attempt), retrying in 10s..."
            sleep 10
          done

      - name: Build
        run: npm run build

      - name: Upload dist artifact
        if: matrix.node == '22'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  smoke-test:
    name: Smoke test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Smoke — stdio transport
        env:
          MCP_TRANSPORT: stdio
          FRESHDESK_API_KEY: test
          FRESHDESK_DOMAIN: test.freshdesk.com
        run: timeout 5 node dist/index.js || true

      - name: Smoke — HTTP /health endpoint
        env:
          FRESHDESK_API_KEY: test
          FRESHDESK_DOMAIN: test.freshdesk.com
        run: |
          MCP_TRANSPORT=http PORT=3333 node dist/index.js &
          SERVER_PID=$!
          sleep 2
          curl -sf http://localhost:3333/health
          kill $SERVER_PID

  lint:
    name: Lint & format (Biome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Biome check
        run: npx biome check --diagnostic-level=error src/

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=moderate
        continue-on-error: true
