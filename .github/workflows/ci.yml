name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build
      run: npm run build

    - name: Check for TypeScript errors
      run: npx tsc --noEmit

  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Check formatting
      run: npx prettier --check . || echo "Consider adding Prettier for consistent formatting"

  security:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run security audit
      run: npm audit --audit-level=moderate
      continue-on-error: true

  smoke-test:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build
      run: npm run build

    - name: Smoke test stdio transport
      run: |
        FRESHDESK_API_KEY=test FRESHDESK_DOMAIN=test.freshdesk.com timeout 5 node dist/index.js || true
      env:
        MCP_TRANSPORT: stdio

    - name: Smoke test HTTP transport health
      run: |
        FRESHDESK_API_KEY=test FRESHDESK_DOMAIN=test.freshdesk.com MCP_TRANSPORT=http PORT=3333 node dist/index.js &
        SERVER_PID=$!
        sleep 2
        curl -f http://localhost:3333/health || exit 1
        kill $SERVER_PID
      env:
        MCP_TRANSPORT: http
